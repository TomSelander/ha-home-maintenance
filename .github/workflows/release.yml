name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package integration
        run: |
          zip -r ha_home_maintenance.zip custom_components/ha_home_maintenance \
            --exclude "*/node_modules/*" \
            --exclude "*/__pycache__/*" \
            --exclude "*.pyc" \
            --exclude "*/panel/src/*" \
            --exclude "*/panel/localize/*" \
            --exclude "*/panel/build.mjs" \
            --exclude "*/panel/package*.json" \
            --exclude "*/panel/tsconfig.json" \
            --exclude "*/panel/logs/*" \
            --exclude "*/logs/*" \
            --exclude "*/specs/*" \
            --exclude "*/.claude/*" \
            --exclude "*/.env*" \
            --exclude "*.log" \
            --exclude "*/.gitignore" \
            --exclude "*/.DS_Store"

      - name: Verify no personal files in archive
        run: |
          if unzip -Z1 ha_home_maintenance.zip \
            | grep -E '(^|/)(logs|specs|node_modules|__pycache__|\.claude)/|\.env|\.log$|\.pyc$'; then
            echo "::error::Release archive contains files that must not be published"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ha_home_maintenance.zip
          generate_release_notes: true
